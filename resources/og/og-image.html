<!doctype html>
<!-- Source for public/images/og-image.jpg. Regenerate:
     google-chrome --headless --disable-gpu --hide-scrollbars --window-size=1200,630 \
       --screenshot=og.png resources/og/og-image.html
     then convert og.png to public/images/og-image.jpg (JPEG q88). -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.bunny.net/css?family=inter:500,600,700|gabarito:700,800,900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, sans-serif;
    background: #fbfaff; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
  .grid { position: absolute; inset: 0;
    background-image: radial-gradient(#6C5CE722 1.5px, transparent 1.5px); background-size: 28px 28px; }
  .left { position: absolute; left: 72px; top: 44px; width: 560px; }
  .logo { width: 360px; display: block; margin-left: -14px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; margin-top: 22px; padding: 8px 16px;
    border-radius: 999px; background: #fff; border: 2px solid #d9d0ff; color: #5536cc;
    font-weight: 700; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4ECDC4; box-shadow: 0 0 0 5px #4ECDC433; }
  h1 { font-family: Gabarito, sans-serif; font-weight: 900; font-size: 76px; line-height: .95;
    letter-spacing: -0.04em; color: #0b0a1a; margin-top: 20px; }
  h1 span { background: linear-gradient(90deg, #6344e0, #dc568b); -webkit-background-clip: text; color: transparent; }
  p.sub { margin-top: 20px; font-size: 24px; line-height: 1.38; color: #4b4b63; font-weight: 500; }
  .url { position: absolute; left: 72px; bottom: 44px; display: flex; align-items: center; gap: 14px;
    font-family: Gabarito, sans-serif; font-weight: 800; font-size: 28px; color: #3a278c; }
  .url b { padding: 10px 22px; border-radius: 16px; background: #6344e0; color: #fff;
    box-shadow: 0 12px 30px -8px #6344e099; }

  .phone { position: absolute; right: 70px; top: 58px; width: 450px; padding: 14px; border-radius: 38px;
    background: #0b0a1a; transform: rotate(3deg); box-shadow: 0 40px 80px -20px #3a278c80; }
  .screen { border-radius: 28px; padding: 22px; background: linear-gradient(135deg, #5536cc, #6344e0 55%, #dc568b); }
  .bar { display: flex; justify-content: space-between; align-items: center; color: #fffc; font-weight: 700; font-size: 15px; }
  .bar span { padding: 6px 12px; border-radius: 999px; background: #ffffff26; }
  .bar .live { background: none; display: flex; align-items: center; gap: 7px; }
  .bar .live i { width: 9px; height: 9px; border-radius: 50%; background: #FFE66D; }
  .q { margin-top: 16px; background: #fff; border-radius: 20px; padding: 22px 18px; text-align: center; }
  .q small { font-size: 13px; font-weight: 700; letter-spacing: .16em; color: #6C5CE7; }
  .q div { margin-top: 8px; font-family: Gabarito, sans-serif; font-weight: 800; font-size: 27px; color: #0b0a1a; line-height: 1.15; }
  .timer { height: 8px; margin-top: 14px; border-radius: 9px; background: #ffffff33; overflow: hidden; }
  .timer i { display: block; height: 100%; width: 62%; background: #FFE66D; border-radius: 9px; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .a { height: 78px; border-radius: 16px; display: flex; align-items: center; gap: 10px; padding: 0 14px;
    color: #fff; font-weight: 800; font-size: 21px; font-family: Gabarito, sans-serif; box-shadow: inset 0 -5px 0 #0002; }
  .a em { font-style: normal; width: 30px; height: 30px; border-radius: 9px; background: #ffffff38;
    display: grid; place-items: center; font-size: 15px; }
  .a.ok { outline: 4px solid #fff; outline-offset: -4px; }
  .a.ok::after { content: "✓"; margin-left: auto; width: 28px; height: 28px; border-radius: 50%;
    background: #fff; color: #2fb3a9; display: grid; place-items: center; font-size: 17px; }

  .badge { position: absolute; background: #fff; border-radius: 20px; padding: 12px 18px;
    box-shadow: 0 20px 40px -12px #3a278c55; font-weight: 800; font-family: Gabarito, sans-serif; display: flex; align-items: center; gap: 10px; }
  .badge .av { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; }
  .badge small { display: block; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; color: #8a8aa3; }
  .confetti { position: absolute; border-radius: 3px; }
</style>
</head>
<body>
  <div class="blob" style="width:420px;height:420px;left:-140px;top:-120px;background:#bfaeff88"></div>
  <div class="blob" style="width:380px;height:380px;right:-60px;bottom:-160px;background:#4ECDC455"></div>
  <div class="blob" style="width:300px;height:300px;right:300px;top:-140px;background:#FF6B6B33"></div>
  <div class="grid"></div>

  <div class="left">
    <img class="logo" src="../../public/images/logo.png" alt="">
    <div class="pill"><span class="dot"></span>Kuis real-time · Gratis</div>
    <h1>Buat Kuis,<br><span>Main Bareng!</span></h1>
    <p class="sub">Kuis interaktif seru untuk kelas, kantor, &amp; tongkrongan. Gabung pakai kode 6 digit.</p>
  </div>
  <div class="url"><b>yahoot.web.id</b></div>

  <div class="phone">
    <div class="screen">
      <div class="bar"><span>02 / 10</span><span class="live"><i></i>LIVE</span><span>⏱ 18s</span></div>
      <div class="timer"><i></i></div>
      <div class="q"><small>PERTANYAAN 2</small><div>Planet terbesar di tata surya?</div></div>
      <div class="answers">
        <div class="a" style="background:#FF6B6B"><em>A</em>Mars</div>
        <div class="a ok" style="background:#4ECDC4"><em>B</em>Jupiter</div>
        <div class="a" style="background:#f2b53a"><em>C</em>Venus</div>
        <div class="a" style="background:#6C5CE7"><em>D</em>Saturnus</div>
      </div>
    </div>
  </div>

  <div class="badge" style="right:440px;top:340px;transform:rotate(-7deg)">
    <div class="av" style="background:#FFE66D">🦊</div><div>+850<small>Dina</small></div>
  </div>
  <div class="badge" style="right:36px;bottom:46px;transform:rotate(5deg)">
    <div class="av" style="background:#ebe5ff">🏆</div><div>🔥 Streak ×3<small>Peringkat #1</small></div>
  </div>

  <div class="confetti" style="width:14px;height:26px;background:#FFE66D;right:540px;top:70px;transform:rotate(25deg)"></div>
  <div class="confetti" style="width:12px;height:22px;background:#FF6B6B;right:30px;top:60px;transform:rotate(-30deg)"></div>
  <div class="confetti" style="width:12px;height:12px;border-radius:50%;background:#4ECDC4;right:560px;top:230px"></div>
  <div class="confetti" style="width:14px;height:24px;background:#6C5CE7;right:20px;top:300px;transform:rotate(40deg)"></div>
</body>
</html>
