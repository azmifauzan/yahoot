map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen              443 ssl;
    listen              [::]:443 ssl;
    http2               on;
    server_name         yahoot.web.id;

    ssl_certificate     /etc/letsencrypt/live/yahoot.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yahoot.web.id/privkey.pem;     # <- certbot trigger
    ssl_trusted_certificate /etc/letsencrypt/live/yahoot.web.id/chain.pem;
    ssl_dhparam         /etc/letsencrypt/dhparams/dhparam.pem;               # provided by the image

    client_max_body_size 20m;

    # ---- Reverb WebSocket (Pusher protocol) ----
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_pass http://yahoot-app:8080;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_pass http://yahoot-app:80;
    }
}
